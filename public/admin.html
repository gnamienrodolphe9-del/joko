<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOKO · Back-office</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#FAF8F5;color:#0F0F0F}header{background:#0F0F0F;color:#fff;padding:16px 24px;font-weight:800;font-size:20px}main{max-width:1000px;margin:auto;padding:24px}
.bloc{background:#fff;border:1px solid #E5E1DA;border-radius:14px;padding:16px;margin-bottom:16px}.ligne{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #E5E1DA}.ligne>div{flex:1 1 240px}
button{min-height:36px;border-radius:8px;padding:0 12px;font-weight:800;cursor:pointer;border:2px solid #E5E1DA;background:#fff}.valider{background:#F7941D;border:0}.refuser{border-color:#D93025;color:#B3261E}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}.chiffres b{display:block;font-size:28px}</style></head><body><header>JOKO · Back-office de modération</header><main id="contenu"></main>
<script>
const jetonModerateur = localStorage.jeton, contenu = document.querySelector('#contenu');
const appelerApi = async (chemin, options = {}) => {
  const reponse = await fetch('/api' + chemin, { method: options.methode || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + jetonModerateur }, body: options.corps && JSON.stringify(options.corps) });
  const donnees = await reponse.json(); if (!reponse.ok) throw new Error(donnees.error); return donnees;
};
const echapper = (texte) => String(texte ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const decider = async (chemin, corps, motifSuggere) => { const motif = prompt('Motif :', motifSuggere) || ''; await appelerApi(chemin, { methode: 'PATCH', corps: { ...corps, reason: motif } }); chargerTableauDeBord(); };
async function chargerTableauDeBord() {
  try {
    const [offresEnAttente, signalements, tableau] = await Promise.all([appelerApi('/admin/opportunities?status=pending'), appelerApi('/admin/reports'), appelerApi('/admin/dashboard')]);
    const compter = (statut) => (tableau.offres.find((ligne) => ligne.status === statut) || { n: 0 }).n;
    contenu.innerHTML = `<div class="chiffres"><div class="bloc">En attente<b>${offresEnAttente.length}</b></div><div class="bloc">Vérifiées<b>${compter('VERIFIEE')}</b></div><div class="bloc">À vérifier<b>${compter('A_VERIFIER')}</b></div><div class="bloc">Signalées<b>${compter('SIGNALEE')}</b></div><div class="bloc">Signalements 7 j<b>${tableau.signalements_7j}</b></div><div class="bloc">Délai moyen (h)<b>${tableau.delai_moyen_h ?? '—'}</b></div></div>
<div class="bloc"><h3>Offres à valider</h3>${offresEnAttente.map((offre) => `<div class="ligne"><div><b>${echapper(offre.title)}</b><br>${echapper(offre.type)} · ${echapper(offre.city)} · ${echapper(offre.contact)}</div><button class="valider" onclick="decider('/admin/opportunities/${offre.id}',{decision:'approve',status:'A_VERIFIER'},'Publiée, à vérifier')">Valider</button><button onclick="decider('/admin/opportunities/${offre.id}',{decision:'approve',status:'VERIFIEE'},'Structure et numéro vérifiés')">Valider (vérifiée)</button><button class="refuser" onclick="decider('/admin/opportunities/${offre.id}',{decision:'reject'},'Offre incohérente')">Refuser</button><button onclick="decider('/admin/opportunities/${offre.id}',{decision:'needs_info'},'Preuve demandée')">Complément</button></div>`).join('') || '<p>File vide.</p>'}</div>
<div class="bloc"><h3>Signalements à examiner</h3>${signalements.map((signalement) => `<div class="ligne"><div><b>${echapper(signalement.title)}</b><br>${echapper(signalement.kind)}${signalement.amount ? ' · ' + signalement.amount + ' FCFA' : ''}</div><button class="refuser" onclick="decider('/admin/reports/${signalement.id}',{confirm:true},'Arnaque confirmée')">Confirmer</button><button onclick="decider('/admin/reports/${signalement.id}',{confirm:false},'Signalement non fondé')">Rejeter</button></div>`).join('') || '<p>Aucun signalement.</p>'}</div>
<div class="bloc"><h3>Journal des actions</h3>${tableau.journal.map((action) => `<div class="ligne">#${action.moderator_id} · ${echapper(action.object)} · <b>${echapper(action.decision)}</b> · ${echapper(action.reason)} · ${new Date(action.created_at).toLocaleString('fr-FR')}</div>`).join('')}</div>`;
  } catch (erreur) { contenu.innerHTML = '<div class="bloc">Accès réservé aux modérateurs. <a href="/">Se connecter</a> avec un compte modérateur ou administrateur.<br>' + echapper(erreur.message) + '</div>'; }
}
jetonModerateur ? chargerTableauDeBord() : contenu.innerHTML = '<div class="bloc">Connectez-vous d\'abord via <a href="/">l\'application</a>.</div>';
</script></body></html>
